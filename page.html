<main id="tapp-content" class="page">
  <!-- Home Page / 主页 -->
  <section data-view="home" class="home-view">
    <div class="ark-home-inner">
      <h1 class="ark-title" data-i18n="title">明日方舟</h1>
      <button type="button" class="ark-debug-btn" data-nav="debug" data-i18n="debug">Debug</button>
    </div>
  </section>

  <!-- Debug Page / 调试页 -->
  <section data-view="debug" class="debug-view" hidden>
    <div style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;line-height:1.5;color:#e0e0e0;background:#14181d;min-height:100vh;padding:16px;box-sizing:border-box;">
      <button type="button" data-nav="home"
        style="background:#1e242b;color:#e0e0e0;border:1px solid #2c333a;border-radius:4px;font-weight:700;font-size:12px;padding:6px 12px;cursor:pointer;margin-bottom:12px;">
        ← Back
      </button>
      <div style="font-size:18px;font-weight:700;color:#f8f8f2;margin-bottom:16px;">Skland Debug Console</div>

      <div style="background:#1e242b;border:1px solid #2c333a;border-radius:6px;padding:12px;margin-bottom:12px;">
        <div style="font-size:11px;color:#8b95a1;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Skland Token (cred,token)</div>
        <input data-debug-token type="password" placeholder="cred,token"
          style="width:100%;box-sizing:border-box;background:#14181d;border:1px solid #2c333a;border-radius:4px;padding:8px 10px;color:#a5f3a0;font-family:inherit;font-size:13px;outline:none;" />
      </div>

      <div style="background:#1e242b;border:1px solid #2c333a;border-radius:6px;padding:12px;margin-bottom:12px;">
        <div style="font-size:11px;color:#8b95a1;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Endpoint</div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
          <span style="background:#7aa2f7;color:#14181d;font-weight:700;font-size:11px;padding:3px 8px;border-radius:3px;">GET</span>
          <select data-debug-endpoint
            style="flex:1;background:#14181d;border:1px solid #2c333a;border-radius:4px;padding:6px 10px;color:#e0e0e0;font-family:inherit;font-size:12px;outline:none;">
            <option value="binding">player/binding</option>
            <option value="info">player/info</option>
            <option value="cultivate">cultivate/player</option>
          </select>
        </div>
        <div data-debug-params
          style="display:none;flex-direction:column;gap:6px;margin-bottom:8px;">
          <div style="font-size:11px;color:#8b95a1;text-transform:uppercase;letter-spacing:0.5px;">Params</div>
          <input data-debug-uid type="text" placeholder="uid"
            style="background:#14181d;border:1px solid #2c333a;border-radius:4px;padding:6px 10px;color:#e0e0e0;font-family:inherit;font-size:12px;outline:none;" />
        </div>
        <button data-debug-send
          style="background:#3fb950;color:#0a0c10;border:none;border-radius:4px;font-weight:700;font-size:13px;padding:8px 18px;cursor:pointer;">
          Send Request
        </button>
      </div>

      <div data-debug-response></div>
    </div>
  </section>

  <!-- Assets Page / 资产页 -->
  <section data-view="assets" class="home-view" hidden></section>
</main>
